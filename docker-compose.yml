services:
  # ----------------------------------------------------------------------------
  # SafePath Vue.js frontend
  # ----------------------------------------------------------------------------


  frontend:
    build: ./frontend
    command: npm run dev
    env_file:
      - .env
    depends_on:
      - backend
    #  - langflow
    networks:
      - caddy
    #  - langflow-net     # <-- so langflow can resolve "postgres"
    labels:
      # Public entry point. Caddy serves the UI and reverse-proxies the
      # browser-facing backends so they can stay private (no public domain):
      #   /api/*      -> backend:9000      (REST API)
      #   /tile/*     -> openstreetmap:80  (map tiles)
      #   /langflow/* -> langflow:7860     (chat API; /langflow prefix stripped)
      # Everything else falls through to the Vue dev server on 8080.
      # handle blocks evaluate in numeric order; first match wins.
      caddy: safepath.duckdns.org
      caddy.1_handle: /api/*
      caddy.1_handle.reverse_proxy: backend:9000
      caddy.2_handle: /tile/*
      caddy.2_handle.reverse_proxy: openstreetmap:80
      caddy.3_handle_path: /langflow/*
      caddy.3_handle_path.reverse_proxy: langflow:7860
      caddy.4_handle: /*
      caddy.4_handle.reverse_proxy: "{{upstreams 8080}}"

  backend:
    build: ./backend
    env_file:
      - .env
    networks:
      # Keep on the caddy network so other containers (e.g. langflow's
      # SSRF allow-list "backend.local") can still reach it internally.
      caddy:
        aliases:
          - backend.local
      # Put the backend on the private VPN network with a fixed IP so it is
      # reachable ONLY by clients connected through WireGuard (see wg-easy).
      vpn:
        ipv4_address: 172.28.0.90
    environment:
      - ENV=production
    # depends_on:
    #   - langflow
    # Direct access by name, VPN-only: https://backend.safepath.duckdns.org
    # Public visitors get 403; only WireGuard traffic (source = wg-easy at
    # 172.28.0.3) is proxied through. The public app still reaches the API
    # via the frontend gateway's /api/* route (backend:9000), unaffected.
    labels:
      caddy: backend.safepath.duckdns.org
      caddy.@vpn.remote_ip: "172.28.0.3"
      caddy.route.0_reverse_proxy: "@vpn {{upstreams 9000}}"
      caddy.route.1_respond: '"VPN access required. your ip is {http.request.remote.host}" 403'

  # ----------------------------------------------------------------------------
  # WireGuard VPN gateway (wg-easy)
  #
  # This is the only VPN-related service that stays exposed to the internet,
  # on UDP 51820. Once a teammate connects with their WireGuard client, they
  # land on the private 10.8.0.0/24 network and can route into the docker
  # `vpn` network (172.28.0.0/24) to reach VPN-only services like the backend.
  #
  # Admin web UI runs on 51821. Generate client configs / QR codes there.
  # Set WG_HOST to your public host and PASSWORD_HASH to a bcrypt hash
  # (create one with:  docker run -it ghcr.io/wg-easy/wg-easy wgpw 'yourpass').
  # ----------------------------------------------------------------------------
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: wg-easy
    environment:
      - WG_HOST=safepath.duckdns.org              # public address clients dial
      - PASSWORD_HASH=$$2a$$12$$6g6Eev0O.ABGxZPWw8lI1eBPbC3KNFSZ5YI1Fks.Yd6D.UqYh6jHy # admin UI login
      - WG_DEFAULT_ADDRESS=10.8.0.x               # VPN client IP range
      - WG_DEFAULT_DNS=172.28.0.53                        # no pushed DNS
      # Routes pushed to clients: the VPN subnet + the docker `vpn` subnet.
      # This is what lets a connected client reach the backend at 172.28.0.10.
      - WG_ALLOWED_IPS=10.8.0.0/24,172.28.0.0/24
    volumes:
      - wg-easy-data:/etc/wireguard
    ports:
      - "51820:51820/udp"   # WireGuard tunnel (must be public)
      - "51821:51821/tcp"   # admin web UI (consider firewalling to admins)
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    networks:
        vpn:
         ipv4_address: 172.28.0.3

  # ----------------------------------------------------------------------------
  # OpenStreetMap tile server (run-only)
  #
  # NOTE: This service expects the `berlin-data` volume to already contain an
  # imported Berlin database. On a fresh machine you MUST run the `osm-import`
  # service first (see below) before `docker-compose up` will produce tiles.
  # ----------------------------------------------------------------------------
  openstreetmap:
    image: overv/openstreetmap-tile-server
    container_name: openstreetmap
    #ports:
    #  - "8081:80"
    volumes:
      - berlin-data:/data/database/
    command: run
    restart: always
    environment:
      - ALLOW_CORS=enabled
      - SSL_POLICY=none
    networks:
      - caddy
    # Tiles reach the public app via the frontend gateway /tile/*. Additionally
    # expose a VPN-only name for direct/admin access to the tile server.
    labels:
      caddy: osm.safepath.duckdns.org
      caddy.@vpn.remote_ip: "172.28.0.3"
      caddy.route.0_reverse_proxy: "@vpn {{upstreams 80}}"
      caddy.route.1_respond: '"VPN access required. your ip is {http.request.remote.host}" 403'
  # ----------------------------------------------------------------------------
  # OpenStreetMap tile server (one-shot import)
  #
  # Activated only via the "setup" profile so it does not run on `up`.
  # Run once on a fresh machine:
  #
  #   docker-compose --profile setup run --rm osm-import
  #
  # This downloads the Berlin .osm.pbf (~500 MB) and imports it into the
  # shared `berlin-data` volume. The process takes 20-60 minutes and needs
  # tens of GB of free disk. After it finishes, `docker-compose up` will
  # start the `openstreetmap` service with data ready to serve.
  # ----------------------------------------------------------------------------
  osm-import:
    image: overv/openstreetmap-tile-server
    profiles: [ "setup" ]
    volumes:
      - berlin-data:/data/database/
    environment:
      - DOWNLOAD_PBF=https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf
      - DOWNLOAD_POLY=https://download.geofabrik.de/europe/germany/berlin.poly
    command: import 


  
  mcp:
    build: ./backend
    working_dir: /app/mcp
    command: ["python", "mcp_server.py"]
    volumes:
      - ./backend:/app
    networks:
      - caddy   # <-- must share a network with `backend` so it can resolve "mcp"

  # ----------------------------------------------------------------------------
  # OSRM walking-profile routing engine (run-only)
  #
  # Serves real pedestrian routes for travelMode="walking". The public OSRM
  # demo server (used for driving) does NOT actually have a foot dataset —
  # verified by comparing its /route/v1/driving/ and /route/v1/foot/ responses
  # for the same two points: identical distance/duration, i.e. "foot" silently
  # falls back to driving-speed results instead of erroring. Self-hosting with
  # OSRM's bundled foot.lua profile gives real walking routes/durations.
  #
  # NOTE: expects the `osrm-foot-data` volume to already contain a processed
  # Berlin extract. On a fresh machine you MUST run `osrm-foot-import` first
  # (see below) before this serves real routes.
  # ----------------------------------------------------------------------------
  osrm-foot:
    image: osrm/osrm-backend
    command: osrm-routed --algorithm mld /data/berlin-latest.osrm
    volumes:
      - osrm-foot-data:/data
    ports:
      - "5001:5000"        # host access for debugging; backend uses http://osrm-foot:5000 internally
    networks:
      - caddy       # <-- must share a network with `backend` so it can resolve "osrm-foot"
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # OSRM walking-profile data build (one-shot, TWO steps)
  #
  # Step 1 (osrm-foot-download) fetches Berlin's .osm.pbf using a small,
  # actively-maintained Alpine image. Step 2 (osrm-foot-import) preprocesses
  # it with OSRM's bundled foot.lua profile (extract -> partition ->
  # customize, the MLD pipeline).
  #
  # Why two separate images: osrm/osrm-backend is built on Debian Stretch,
  # which is EOL — its apt mirrors (deb.debian.org) 404 on `apt-get update`,
  # so installing wget/curl *inside* that image doesn't work anymore. Alpine's
  # package index isn't EOL, so downloading there and handing the file off via
  # the shared volume sidesteps the problem entirely.
  #
  # Run once on a fresh machine, in order:
  #
  #   docker compose -f docker-compose.dev.yml --profile setup run --rm osrm-foot-download
  #   docker compose -f docker-compose.dev.yml --profile setup run --rm osrm-foot-import
  #
  # A city-sized extract takes a few minutes (much lighter than the tile
  # server's osm-import). After both finish, `osrm-foot` will serve real
  # walking routes.
  # ----------------------------------------------------------------------------
  osrm-foot-download:
    image: alpine:3.20
    profiles: ["setup"]
    volumes:
      - osrm-foot-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /data/berlin-latest.osm.pbf ]; then
          echo "Berlin extract already present, skipping download."
        else
          apk add --no-cache curl
          echo "Downloading Berlin extract..."
          curl -fSL -o /data/berlin-latest.osm.pbf https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf
        fi

  osrm-foot-import:
    image: osrm/osrm-backend
    profiles: ["setup"]
    volumes:
      - osrm-foot-data:/data
    entrypoint: ["/bin/bash", "-c"]
    # IMPORTANT: `command` must be a YAML list with the whole script as ONE
    # element (via the `- |` block scalar below). A bare `command: |` string
    # gets word-split by Compose into many separate arguments — `bash -c`
    # then only treats the first word as the script and turns everything
    # else into stray positional parameters ($1, $2, ...), so nothing in
    # the script actually runs. This bit us once already; keep it a list.
    command:
      - |
        set -e
        if [ ! -f /data/berlin-latest.osm.pbf ]; then
          echo "ERROR: /data/berlin-latest.osm.pbf not found — run osrm-foot-download first." >&2
          exit 1
        fi
        osrm-extract -p /opt/foot.lua /data/berlin-latest.osm.pbf
        osrm-partition /data/berlin-latest.osrm
        osrm-customize /data/berlin-latest.osrm
        echo "OSRM foot-profile data build complete."



volumes:
  berlin-data:
    external: true
    name: senior-project-safepath_berlin-data
  langflow-data:       # Langflow config dir
  langflow-postgres:   # Langflow Postgres data
  wg-easy-data:        # persists WireGuard keys & client configs
  osrm-foot-data:

networks:
  caddy:
    external: true
  # Private network for VPN-only services. wg-easy bridges connected
  # clients into this subnet so they can reach the backend (172.28.0.10).
  vpn:
    driver: bridge  
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # Private link between Langflow and its Postgres database.
  langflow-net:
    driver: bridge
