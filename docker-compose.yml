volumes:
  #langflow-data:
  berlin-data:
    external: true
    name: senior-project-safepath_berlin-data
  # langflow-db:
  wg-easy-data:        # persists WireGuard keys & client configs

networks:
  caddy:
    external: true
  # Private network for VPN-only services. wg-easy bridges connected
  # clients into this subnet so they can reach the backend (172.28.0.10).
  vpn:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
